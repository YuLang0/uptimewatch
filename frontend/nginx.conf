# web 컨테이너: SPA 정적 파일 제공 + /api 를 api 컨테이너로 프록시
# 앞단 HTTPS 리버스 프록시(Caddy 등, 도커 사설망)가 전달한 실제 클라이언트 IP 를 신뢰
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_public:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;   # API 요청 본문 크기 제한

    # api 컨테이너가 재시작되어 IP 가 바뀌어도 따라가도록 Docker 내장 DNS 로 매 10초 재해석
    # (proxy_pass 에 변수를 쓰면 시작 시 1회 고정 해석하지 않음)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # 보안 헤더 (HTTPS 리버스 프록시 앞단에서 HSTS 추가 권장)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/login    { limit_req zone=api_auth burst=5 nodelay; proxy_pass $api_upstream; include /etc/nginx/conf.d/proxy_params.inc; }
    location = /api/auth/register { limit_req zone=api_auth burst=3 nodelay; proxy_pass $api_upstream; include /etc/nginx/conf.d/proxy_params.inc; }
    location /api/public/         { limit_req zone=api_public burst=30 nodelay; proxy_pass $api_upstream; include /etc/nginx/conf.d/proxy_params.inc; }
    location /api/                { proxy_pass $api_upstream; include /etc/nginx/conf.d/proxy_params.inc; }

    # 주의: location 안에서 add_header 를 쓰면 위 보안 헤더가 상속되지 않으므로 expires 만 사용
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
