[project]
name = "uptimewatch-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:aiosmtpd.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"alembic/*" = ["E501", "UP", "I"]
